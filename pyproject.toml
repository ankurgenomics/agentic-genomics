[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-genomics"
version = "0.1.0"
description = "Agentic AI systems for genomics — starting with an autonomous variant interpretation copilot."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ankur Sharma", email = "learning.ankur.ai@gmail.com" },
]
keywords = [
    "genomics",
    "bioinformatics",
    "agentic-ai",
    "llm",
    "langgraph",
    "variant-interpretation",
    "clinical-genomics",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.39.0",
    "pydantic>=2.8",
    "pysam>=0.22.1",
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "pandas>=2.2",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.38",
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "plotly>=5.24",
]
openai = [
    "langchain-openai>=0.2.0",
]
mcp = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ankurgenomics/agentic-genomics"
Repository = "https://github.com/ankurgenomics/agentic-genomics"
Issues = "https://github.com/ankurgenomics/agentic-genomics/issues"

[project.scripts]
agentic-genomics = "agentic_genomics.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_genomics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks routinely load dotenv before other imports and that's fine.
"notebooks/*.ipynb" = ["E402"]
# Streamlit apps commonly use NamedTemporaryFile without a context manager
# when the file's lifetime needs to outlive the handler.
"apps/*.py" = ["SIM115"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "network: tests that require network access (skipped by default in CI without keys)",
    "slow: tests that are slow",
]

[tool.coverage.run]
# pysam's Cython event loop clashes with coverage's C-level trace hooks on
# Python 3.12+. Use the sys.monitoring-based core (PEP 669) instead — it's
# faster and compatible with Cython extensions.
core = "sysmon"
source = ["src/agentic_genomics"]
branch = false

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
]

[tool.mypy]
# 3.11 previously broke mypy outright: numpy's stubs (pulled in via pandas)
# use a PEP 695 `type` statement mypy only parses when the target is
# 3.12+, so with "3.11" mypy aborted before checking a single file of our
# own code ("Type statement is only supported in Python 3.12 and greater").
python_version = "3.12"
strict = false
ignore_missing_imports = true
# Without this, mypy doesn't understand pydantic v2's dynamically
# generated __init__ (field name vs. alias, e.g. ChatAnthropic's
# `model`/`model_name`) and raises false "unexpected keyword argument"
# errors on every pydantic-model construction site.
plugins = ["pydantic.mypy"]
